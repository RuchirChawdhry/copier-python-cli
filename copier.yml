_min_copier_version: "9.14.1"
_subdirectory: template
_templates_suffix: .jinja

project_name:
  type: str
  help: Human-readable project name
  default: My Python CLI

project_slug:
  type: str
  help: Distribution name (lowercase, hyphenated)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

package_name:
  type: str
  help: Importable Python package name
  default: "{{ project_slug | replace('-', '_') }}"

cli_command:
  type: str
  help: Executable command installed by uv
  default: "{{ project_slug }}"

description:
  type: str
  help: Short project description
  default: A fast, friendly Python command-line tool.

author_name:
  type: str
  help: Copyright holder
  default: Ruchir Chawdhry

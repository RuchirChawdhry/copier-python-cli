_min_copier_version: "9.0.0"
_subdirectory: template

project_name:
  type: str
  help: Distribution and CLI name (lowercase kebab-case)
  default: my-python-cli
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Use lowercase letters, numbers and single hyphens; start with a letter.
    {% endif %}

description:
  type: str
  help: One-line description of the project
  default: A small, dependable Python command-line tool.

author_name:
  type: str
  help: Name to include in the MIT license
  default: Your Name

python_version:
  type: str
  help: Python version used for local development
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
  default: "3.13"

copyright_year:
  type: int
  help: Copyright year for the MIT license
  default: 2026
  ask: false

name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/wiki-publish.yml@main
    secrets:
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}

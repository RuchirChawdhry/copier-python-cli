name: Verify Copier template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Generate project, test CLI and build
        run: uv run --no-project --with copier --with pytest pytest tests -q
